- dwr_id: DWR-040
  title: Four of ten behaviour states carry no pass/fail test - reproducibility is untestable
  category: F — Governance Debt
  class: DECISION
  origin: RSB-AUDIT-001 section 5
  discussion_reference: docs/reviews/RSB-AUDIT-001_Road_Soul_Behavior_Vocabulary.md section 5
  date_identified: '2026-08-22'
  reason_deferred: 'DUCK, REBUILD, BREATHE, APPROACH and RETURN carry numeric criteria and are testable.
    ENTER, SUSTAIN, LEAD and HANDOFF are prose-only: ''never a downbeat announcement'', ''inaudible as
    an event'', ''ambient sound must remain audible'' cannot be checked by anyone who did not write them.
    FLOOR is partly testable. A specification whose satisfaction requires asking its author is a preference
    with formatting.'
  executive_context: 'Classed DECISION, not IMPLEMENTATION, because it asks the Executive Team a question
    engineering must not answer alone: how much of the artistry-carrying behaviour is the platform willing
    to quantify? Evidence so far is encouraging - the five quantified states lost nothing by being quantified
    - but that evidence comes from the five easiest, and the remaining four are the ones that carry the
    music. A fabricated threshold would be worse than none; PROVISIONAL tests, explicitly marked, are
    the honest middle.'
  dependencies: Executive ruling on how far to quantify
  trigger_event: WET-SPEC-RSB-001 drafting
  estimated_value: HIGH — the reproducibility claim rests entirely on this
  estimated_complexity: MEDIUM (four states, each needing a defensible test or an explicit PROVISIONAL
    marker)
  recommended_priority: P1
  current_status: Deferred
  resolution: 'PARTIALLY RULED, 2026-08-22, Executive Producer. The taxonomy is ADOPTED and the unit of
    classification is settled: classify CRITERIA, not states. A single behaviour may carry criteria of
    different classes - ENTER carries ''<=2 s'' (Type A) and ''never a downbeat announcement'' (Type C)
    simultaneously. TYPE A machine-measurable. TYPE B observable now, measurable eventually. TYPE C Executive
    judgement. TYPE C GUARDRAIL, ruled constitutional in intent: every Type C criterion SHALL record (1)
    why measurement is currently inappropriate, and (2) WHAT EVIDENCE WOULD JUSTIFY RECONSIDERING THAT
    CLASSIFICATION. Requirement (2) strengthens the engineer''s proposed ''re-review trigger'': a trigger
    is a date, whereas named evidence is falsifiable - the classification can be overturned by something
    specific rather than merely revisited on a schedule. Type C is therefore PROVISIONAL BY DEFAULT and
    permanent only by decision. STILL OPEN: which criteria land in which class. That is the drafting work,
    and it remains sequenced behind CUE-03 and CUE-07 per DWR-041 and behind a transition model per DWR-042.'
  resolution_artifact: docs/reviews/RSB-AUDIT-001_Road_Soul_Behavior_Vocabulary.md Amendment 1; Executive
    Review of commit 47f5268
  resolution_date: '2026-08-22'
  resolution_authority: Executive Producer
