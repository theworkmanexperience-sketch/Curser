    see 'a map graphic dissolves into the upper-left corner' - ER-003's own Layer 2 example is beyond
    every instrument the platform currently owns.
  executive_context: 'The sharper point: that example came from a HUMAN watching, not a machine. A human-observed
    Layer 2 fact and a machine-derived one are different evidence classes - one is reproducible by re-running
    code, the other only by another human watching. DOC-001 requires an instrument be validated before
    its output enters custody, and a human observer''s validation is a second observer, which is exactly
    the EIO/IEO distinction already ruled for EVS. Proposed and NOT adopted: Layer 2 records carry an
    observer field - MACHINE with a named validated instrument, or HUMAN with an observer identity and
    observation class. Neither superior; conflating them would let an unreproducible observation inherit
    a machine-derived record''s authority.'
  dependencies: Executive ruling on Layer 2 schema; a validated Layer 2 instrument if machine observation
    is wanted
  trigger_event: Layer 2 schema design
  estimated_value: MEDIUM-HIGH — decides whether Layer 2 is a real layer or an aspiration
  estimated_complexity: MEDIUM (schema is cheap; a validated visual instrument is not)
  recommended_priority: P2
  current_status: Deferred
- dwr_id: DWR-047
  title: Two proposed production-intelligence KPIs cross ER-003's own boundary; none carry frozen definitions
  category: F — Governance Debt
  class: DECISION
  origin: ER-003-N2 and ER-003-N3
  discussion_reference: docs/rulings/EXECUTIVE_RULINGS.yaml er_003.engineering_notes
  date_identified: '2026-08-22'
  reason_deferred: 'Most listed KPIs are Layer 1 arithmetic and safe. Two are not. RIDE-TO-INFORMATION
    RATIO requires classifying each shot as ride or information - a judgement about what a shot is FOR,
    absent from the FCPXML and invisible in a frame. It is a Layer 3 interpretation wearing a Layer 1
    name. CORRELATION WITH AUDIENCE RETENTION uses data that is not editorial metadata, does not exist
    in the platform, arrives from a distribution service and carries its own consent and accuracy questions;
    published without caveats it invites a causal claim the data cannot support. Separately, NO listed
    KPI carries a frozen definition: this lock holds 180 transitions of 8 kinds, 166 of them Cross Dissolves,
    so ''average dissolve duration'' differs defensibly between a run counting cross-dissolves and one
    counting all transitions. ''Transition density by chapter'' has no definition of chapter.'
  executive_context: 'Proposed and NOT adopted: a KPI is admissible under ER-003 only if every term is
    derivable from Layer 1 or an instrumented Layer 2 with no human classification step. Ride-to-information
    becomes admissible once an Executive-defined shot taxonomy exists - then the classification is Executive-authored
    and the platform merely counts. Retention correlation is deferred as an external-data-class question,
    not an editorial-mechanics one. Every KPI carries a frozen definition, a version, and the resolver
    version that produced it, exactly as registries carry registry_version. This is the measurement-vs-score
    test applied to production intelligence.'
  dependencies: Executive ruling before either KPI is implemented; a shot taxonomy for the first
  trigger_event: first KPI implementation
  estimated_value: HIGH — an unversioned KPI compared across productions is a composite score by another
    route
  estimated_complexity: LOW to specify, HIGH to retrofit if skipped
  recommended_priority: P1
  current_status: Deferred
