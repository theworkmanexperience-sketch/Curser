- dwr_id: DWR-043
  title: Expression content sits inside CONDUCTOR_SCORE, contrary to the governs/performs distinction
  category: F — Governance Debt
  class: DECISION
  origin: RSB-AUDIT-001 Amendment 1, Correction 3
  discussion_reference: docs/reviews/RSB-AUDIT-001_Road_Soul_Behavior_Vocabulary.md Amendment 1
  date_identified: '2026-08-22'
  reason_deferred: 'Executive Observation 2026-08-22: ''Conductor''s Score is behavior. Road Soul is expression.
    One governs. One performs. Those should never be merged.'' Applied to the artifact it finds a live
    violation: CONDUCTOR_SCORE.yaml carries instrumentation_guidance on 13 of 15 cues, with fields colour,
    instruments, tempo, tonality, prohibited - for example ''fingerpicked or clean electric guitar, pad,
    brushed kit or no kit, low strings; slow to mid; warm major or dorian''. Each cue also carries road_soul_family.
    That is expression inside the behaviour artifact.'
  executive_context: 'Classed DECISION because the remedy is not obvious and is not engineering''s to
    pick: split the artifact, keep the field but mark it advisory-and-non-normative, or accept that the
    Conductor''s Score legitimately carries a pointer to expression without owning it. Only ''prohibited''
    reads as behaviour, and only where phrased as a constraint on function (''no percussion transients
    that read as an event'') rather than on material. Flagged, NOT fixed - splitting CONDUCTOR_SCORE while
    ESS-002 is still open against it would be restructuring the artifact under an open decision, and the
    Executive has directed that validation precede further governance work.'
  dependencies: Executive ruling on the remedy; ESS-002 closed first
  trigger_event: ESS-002 disposition, then WET-SPEC-RSB-001 drafting
  estimated_value: MEDIUM-HIGH — the distinction is a candidate architectural principle and the artifact
    contradicts it
  estimated_complexity: LOW to flag, UNKNOWN to remedy (depends which remedy)
  recommended_priority: P2
  current_status: Deferred
  resolution: 'ESCALATED 2026-08-22 and now BLOCKING. Executive Clarification 2 makes the finding sharper
    than when it was raised: instrumentation_guidance on 13 of 15 cues of CONDUCTOR_SCORE is PALETTE content,
    which the platform may reference but not author. The clarification is prospective, so the current
    artifact and RE-001 are NOT retroactively non-conforming. BUT CONDUCTOR_SCORE regenerates on the ESS-002
    disposition, and gen_artifacts.py would re-author that content at that moment - knowingly emitting
    a non-conforming artifact. Three options recorded at EC-N2: (A) retain, marked ADVISORY and NON-NORMATIVE,
    awaiting palette ratification; (B) strip and replace with a palette reference - BLOCKED, no palette
    exists; (C) freeze the field and emit it verbatim as inherited content rather than re-deriving it.
    NO RECOMMENDATION - this is the palette-ownership decision and it is Executive. RULED 2026-08-22:
    OPTION C. ''Until Executive-approved Road Soul Palettes exist, instrumentation guidance inherited
    from previously governed artifacts shall be preserved verbatim and explicitly identified as inherited
    content. The platform shall neither author nor extend expressive guidance during regeneration.'' IMPLEMENTED
    in intelligence/p2/ess/scripts/gen_artifacts.py the same day: the field is renamed inherited_expressive_guidance
    and now emits governance_class, normative: false, authored_by: NOT_THE_PLATFORM, status AWAITING_EXECUTIVE_PALETTE_RATIFICATION,
    its ruling_ref, its provenance chain, and an on_palette_approval instruction to DELETE the block and
    replace it with a palette reference by governed regeneration. Values are carried forward verbatim,
    never re-derived. A SHA-256 digest guard over the frozen table stops generation with a NOTICE if any
    value is edited - the ruling is checkable rather than merely intended (NO SILENT RECOVERY). Guard
    verified in both directions: silent when frozen, fires on mutation. 13 of 15 cues carry the block;
    the two conducted silences correctly do not. NO LONGER BLOCKING. The artifact itself is NOT regenerated
    here - regeneration belongs to the ESS-002 disposition, and regenerating outside a governed trigger
    would be the defect this entry exists to prevent.'
  resolution_artifact: docs/rulings/EXECUTIVE_RULINGS.yaml EC-N2; intelligence/p2/ess/scripts/gen_artifacts.py
  resolution_date: '2026-08-22'
  resolution_authority: Executive Producer / Chairman
- dwr_id: DWR-044
  title: Palette ownership is unallocated - it is neither behaviour nor any layer of the Road Soul stack
  category: F — Governance Debt
  class: DECISION
  origin: ER-002 engineering note N1
  discussion_reference: docs/rulings/EXECUTIVE_RULINGS.yaml ER-002-N1
  date_identified: '2026-08-22'
  reason_deferred: 'ER-002 places ''Instrumentation: electric guitar, warm organ, upright bass, brush
    kit'' inside the platform-owned Type A Behavioural Specification. By the ruling''s own test - behaviour
    defines what the music must DO - a named instrument says what the music IS, not what it does. The
    line runs THROUGH the instrumentation field: constraints are behaviour and are testable (''no lyrics'',
    ''no builds'', ''no percussion transients that read as an event''); a palette is expression. The same
    finding is already open as DWR-043 against CONDUCTOR_SCORE, and it now appears inside the ruling that
    was meant to separate the two.'
  executive_context: 'Proposed remedy, NOT adopted: the platform may CITE a governed family palette but
    may not INVENT one. Family palettes are Executive-authored once per family and live with Road Soul,
    not with the Conductor''s Score. A Behavioural Specification then reads ''palette: Road Soul MOTION
    (see family definition)''. This preserves engine-independence - the spec stays handable to any generation
    engine - without the platform authoring musical material. Open question underneath: a palette is not
    Lexicon, not Grammar, not Behaviour and not Composition. It sits outside the four-layer stack entirely.
    Either the stack needs a fifth element or the palette belongs to Composition as an Executive-owned
    input.'
  dependencies: Executive ruling on palette ownership and on where it sits in the stack
  trigger_event: first Road Soul cue PDR, or WET-SPEC-RSB-001 drafting
  estimated_value: HIGH — it decides what a Behavioural Specification may contain, and that spec is the
    platform's durable asset
  estimated_complexity: LOW to specify once ruled
  recommended_priority: P1
  current_status: Deferred
  resolution: 'PARTIALLY RULED, 2026-08-22, Executive Clarification 2. PALETTE is recognised as a DISTINCT
    ARCHITECTURAL LAYER - the fifth - sitting between BEHAVIOR and COMPOSITION. Palette constrains permissible
    expressive space but does not prescribe musical realization. OWNERSHIP RULED: Executive. The platform
    may REFERENCE an Executive-defined palette and test candidates against it; it shall NOT author, extend,
    add terms to, or infer one. Revised stack: LEXICON -> GRAMMAR -> BEHAVIOR (platform) -> PALETTE (Executive)
    -> COMPOSITION (composer). The three questions: behaviour asks what must the music ACCOMPLISH; palette
    asks what universe may it INHABIT; composition asks what shall this cue BECOME. STILL OPEN: (a) no
    palette has been authored for any family, so nothing can yet be referenced; (b) EC-N1 - a palette
    is only testable if its term vocabulary is closed. Palette conformity is one of ER-001''s eight criteria
    and must therefore report a measurement and a method, but ''discouraged'' has no method. Proposed
    and NOT adopted: PERMITTED->PASS, RESTRICTED->UNCERTAIN-escalate, FORBIDDEN->FAIL, plus a declared
    list_closure of CLOSED or OPEN. That makes palette conformity machine-testable without the platform
    authoring a single term.'
  resolution_artifact: docs/rulings/EXECUTIVE_RULINGS.yaml executive_clarification_2026_08_22.clarification_2;
    notes EC-N1
  resolution_date: '2026-08-22'
  resolution_authority: Executive Producer / Chairman
