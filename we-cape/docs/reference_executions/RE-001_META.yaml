  artifacts_recoverable_from: 'git commit b197e74 (pushed within 8033dc5)'
  status: FLAGGED — NOT REMEDIED. No implementation authorized.
  register_entry: DWR-037
  note: >-
    Recorded here rather than fixed because the remedy is engineering work and RE-002's archival
    is the natural moment to do it once for both. Raised now because the window in which this is
    a cheap fix closes when RE-002 is created with the same defect.

