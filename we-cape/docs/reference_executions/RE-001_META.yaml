known_defects_in_this_baseline:
  - id: D-26
    name: YAML_SEXAGESIMAL_TIMECODE
    severity: DATA_TYPE
    scope: every YAML artifact archived under RE-001
    description: >-
      Timecode fields were serialized bare. Under YAML 1.1 a bare 00:31:43.000 loads as
      the float 1903.0, not the string "00:31:43.000". Any consumer that read a *_tc field
      from an RE-001 artifact received a number, silently.
    detected: 2026-08-22, during the ESS-004 regeneration
    disposition: >-
      NOT corrected in RE-001. An archived Reference Execution is immutable, including in
      its defects — correcting it would destroy the property that makes it a baseline. The
      fix is in the generator; RE-002 will carry it, and the delta between RE-001 and RE-002
      will name D-26 explicitly.
    affects_conclusions: false
    affects_conclusions_basis: >-
      The seconds-valued fields (start_s, end_s, duration_s) are unaffected and are what
      every computation in RE-001 actually used. The *_tc fields are presentational.
      No metric on this scorecard changes.
    register_entry: DWR-038

