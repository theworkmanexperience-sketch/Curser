    status: NOT_OBSERVED
    basis: >-
      No span in the runtime shows the low-sun warm daylight signature. The two warm-ratio excursions (R/B 1.31 and 1.32) are the cold-open night montage and the sustained night block, both artificial amber lighting. Warm ratio never exceeds 1.10 during any daylight span.
  - event_class: FLAG_DETAIL_BEYOND_PRESENCE
    status: OBSERVED_AS_PRESENCE_ONLY
    basis: >-
      A US flag and one or more additional standards are visible at the interior ceremony and honors spans. Identification of the additional standards is not resolvable at 320x180 and is recorded as UNCERTAIN rather than named.
  - event_class: PERSON_IDENTITY
    status: NOT_PERFORMED
    basis: >-
      Prohibited by ADR-009 and WET-SPEC-DIE-001 §11. No face recognition or biometric identification was run. The only person names in this registry are text read from ETC title elements, and they are carried as caption text, not as identifications.
  - event_class: CAMERA_MOTION_CLASS
    status: RECORDED_AS_FRAME_DIFFERENCE_ENERGY_ONLY
    basis: >-
      At 320x180 with a 0.5 s observation grid, camera motion cannot be separated from subject motion or from shot changes. The instrument series is published as FRAME_DIFFERENCE_ENERGY bands; camera-motion class per se is UNCERTAIN except where a sheet shows it directly.
  - event_class: INTERVIEW_COUNT_BY_VISION
    status: NOT_ATTEMPTED
    basis: >-
      Interview counts remain the registry's (TIMELINE_REGISTRY interview_count, RIDER_REGISTRY). Counting subjects visually would duplicate a governed registry value with a weaker method.

