purpose: preserve measured behavioural transitions as FINGERPRINTS. Explicitly NOT arguments for boundary changes,
  per the authorising disposition.
conformance:
- ER-001 no ranking, no recommendation, no preference
- ER-003 mechanics precede meaning; significance is Executive
- ESS-002 retains ownership of the CUE-03 boundary; nothing here infers movement
view:
  source: CONDUCTOR_SCORE.yaml v1.1.0 + Info.fcpxml + lock SRT
  scope: all 15 governed cue and silence regions
  filter:
    has_resolved_boundaries: true
  coverage:
    displayed: 15
    total: 15
missing_data_policy: propagate_unknown
p9_scope_measurement:
  question: VPD-001 P9 - 'music should support orientation rather than lead the scene' - was ruled on 2026-08-22
    to apply to EVERY Road Soul cue including CUE-03. This block measures where orientation elements actually occur.
    It poses the scope question; it does not answer it.
  cues_with_orientation_elements: 10
  cues_without: 5
  cues_without_list:
  - CUE-02b
  - CUE-05
  - CUE-07
  - CUE-09a
  - CUE-09b
  motion_family_note: 'the two MOTION cues differ completely on this axis: CUE-03 is 64.4% orientation-bearing,
    CUE-07 is 0.0%. Both carry LEAD.'
  unresolved: LEAD is specified as 'music carries the span'. P9 says music should support orientation rather than
    lead. Where orientation load is 0.0% - CUE-07, CUE-09a, CUE-09b, CUE-02b, CUE-05 - it is unstated what P9 requires,
    and unstated whether P9 modifies LEAD. P8 holds that the behaviour vocabulary is unchanged 'unless and until
    formally revised', so no state is altered here. AWAITING_EXECUTIVE_INPUT.
