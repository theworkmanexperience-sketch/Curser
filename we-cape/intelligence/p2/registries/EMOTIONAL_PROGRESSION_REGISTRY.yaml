# ============================================================================
# EMOTIONAL_PROGRESSION_REGISTRY (EPR-001)
# Governed upstream artifact of DOCUMENTARY INTENT.
#
# Ratified: EXECUTIVE RATIFICATION ORDER & INGESTION PROMPT - EPR-001
#           Authority: Executive Producer / Chairman   Date: 2026-08-26
#           Reference: PR-001 Architectural Review & Triad Alignment
#
# CUSTODY (order 2.1-2.3):
#   Every entry is source_class EXECUTIVE.
#   The platform MAY read, cite and validate STRUCTURE.
#   The platform SHALL NOT author, populate, infer, extend, suggest or default
#   ANY value. An empty field remains empty.
#
# WHAT THE PLATFORM DID IN PRODUCING THIS FILE:
#   TRANSCRIBED the Executive-custody values already declared in
#   EMOTIONAL_ARC.yaml v1.0.0, which order 1.1 names as the provenance of
#   EPR-001's initial content. beat, segment_refs and audience_state are
#   carried forward verbatim (audience_emotion -> audience_state is a rename
#   ruled by the order's schema, not a change of value).
#   Fields with NO existing Executive declaration are left
#   AWAITING_EXECUTIVE_INPUT. They were not defaulted, inferred or suggested.
# ============================================================================
registry_id: EMOTIONAL_PROGRESSION_REGISTRY
registry_version: "1.3.0"
registry_version_note_1_3_0: >-
  1.2.0 -> 1.3.0, 2026-08-28. EXECUTIVE AUTHORING FOUNDATION transcribed: Executive Ruling Q11
  (Ordered Categorical Dramatic Intensity Standard), the Executive definitions of
  governing_theme and editorial_transition, and the authoring principle "Author the story
  first. The music follows."
  ALL THREE ARE EXECUTIVE DECLARATIONS, TRANSCRIBED VERBATIM. The platform authored no value,
  proposed none, paraphrased none, and extended none. Two open questions the declarations
  raise (OQ-1 comparison-versus-trend, OQ-2 the terminal beat) are RAISED AND LEFT UNANSWERED.
  This increment fills intensity_scale.ordered - one of the 29 empty fields. THE 24 BEAT
  FIELDS REMAIN EMPTY. The regeneration trigger remains held, as below.
registry_version_note: >-
  1.1.0 -> 1.2.0 under EXECUTIVE ORDER - CUSTODY_ALERT_001 FINAL DISPOSITION & WORKBOOK
  GENERATION, 2026-08-28, section 2.4. NO EXECUTIVE VALUE WAS ADDED, ALTERED OR REMOVED by
  this increment. It records the ratified production identity and processes one segment
  reference that the ratification renders unresolvable.
  REGENERATION TRIGGER HELD: the ratification order section 4.5 makes a registry_version
  increment the regeneration trigger. Section 4 of the 2026-08-28 Order suspends downstream
  regeneration until the Executive Authoring Workbook is complete and EPR-001 is ratified.
  This increment therefore ARMS a trigger that MUST NOT FIRE yet. Recorded rather than
  worked around. See IR-002 Q3.
registry_schema_version: "1.0"
source_class: EXECUTIVE
supersedes: "EMOTIONAL_ARC.yaml v1.0.0"

