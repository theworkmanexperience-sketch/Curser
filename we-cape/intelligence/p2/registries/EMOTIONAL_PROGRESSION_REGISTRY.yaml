  consumer may resolve an EPR segment_ref to a timecode.
missing_data_policy: propagate_unknown

governing_invariants:
  invariant_a: >-
    Documentary intent shall never prescribe musical implementation;
    observational measurement shall never prescribe documentary intent.
  invariant_b_non_interpolation: >-
    Executive declarations are intentionally non-interpolable. The platform shall not
    infer intermediate states, trends, averages, smoothing, interpolation, or derived
    dramatic states between declared segment levels.

precondition_contract:
  clause: >-
    Every cue decision cites its beat; a cue that cannot name its emotion and
    responsibility does not generate.
  carried_forward_verbatim_from: "EMOTIONAL_ARC.yaml v1.0.0"
  operational_interpretation: >-
    A cue cannot generate until both the Executive documentary intent (EPR-001) and the
    downstream musical responsibility (Behavior layer / Conductor Score) are available.
  engineering_note_IR002_I1: >-
    RAISED, NOT RESOLVED. The musical responsibility vocabulary is DEFERRED to
    WET-SPEC-RSB-001 by order 1.3, and the Behavior Registry does not yet exist (order
    4.3). As written the precondition therefore cannot be satisfied by any cue until
    WET-SPEC-RSB-001 exists. Nothing is blocked today because
    GATE-2026-08-22-MIE-DOWNSTREAM is CLOSED, but this becomes live at gate-open.
    See IR-002 section 1.

intensity_scale:
  # RESOLVED 2026-08-28 by Executive Ruling Q11 - "Ordered Categorical Dramatic Intensity
  # Standard". Transcribed verbatim; the platform proposed nothing and chose nothing.
  ordered: true
  scale_class: ORDERED_CATEGORICAL
  measures: "narrative significance within the documentary"
  order: [LOW, MODERATE, HIGH, ELEVATED, CLIMACTIC]   # lowest to highest, as declared
  ordinal_constraints:
    - "The categories are ordinal."
    - "They are not numerical."
    - "They shall never be averaged, interpolated, scored, normalized, or smoothed."
    - "Advancement between categories is by explicit Executive declaration only."
  ruling_ref: "Executive Ruling Q11, 2026-08-28"
  ruling_rationale_verbatim: >-
    This preserves the Non-Interpolation Invariant while allowing the documentary to express a
    coherent dramatic progression.
  open_question_raised_not_resolved:
    id: OQ-1
    subject: "comparison versus trend derivation"
    statement: >-
      Ordinality newly permits a consumer to COMPARE two declared levels. Invariant B prohibits
      inferring "trends" between declared segment levels. The four ordinal_constraints above bar
      averaging, interpolation, scoring, normalization and smoothing - they do not say whether
      observing that one declared beat outranks another, and naming that relation (escalation,
      de-escalation, rising action), is a permitted comparison or a prohibited derived state.
      RAISED, NOT ANSWERED. No consumer exists yet that depends on it; the Behavior Registry
      will be the first.
    owner: EXECUTIVE
  naming_note: >-
    The field is called dramatic_intensity and the ruling defines the scale as measuring
    narrative SIGNIFICANCE. Those are not the same word. Under this ruling ELEVATED
    ("Commanding, Emotionally Significant") outranks HIGH ("Purposeful, Energetic") - coherent
    for significance, counterintuitive for energy. Recorded so a future reader who sees only the
    field name does not infer an energy scale. The field is NOT renamed: renaming an
    Executive-ratified field is not a platform act.
  categories:
    LOW:       [Reflective, Observational]
    MODERATE:  [Engaged, Conversational]
    HIGH:      [Purposeful, Energetic]
    ELEVATED:  [Commanding, "Emotionally Significant"]
    CLIMACTIC: [Defining, Irreversible]

prohibited_fields: [palette, instrumentation, stems, BPM, harmony, genre, prompts,
                    dynamics, cue_behaviour, timecodes]

# ----------------------------------------------------------------------------
# FIELD DEFINITIONS
# Declared by the Executive 2026-08-28 in answer to the Authoring Workbook section 0.2,
# which recorded that these two fields had been named by the ratification order and never
# given a meaning. TRANSCRIBED VERBATIM. The platform supplied no definition and did not
# paraphrase, condense or extend either one.
# ----------------------------------------------------------------------------
field_definitions:
  governing_theme:
    title: "Narrative Anchor"
    definition: >-
      The enduring human, institutional, or societal truth that justifies the segment's place
      within the documentary.
    answers: "Why does this scene belong in the film?"
    characteristics: [timeless, narrative, documentary,
                      "independent of music", "independent of editing"]
    examples_given_by_executive: [Service, Brotherhood, Leadership, Legacy,
                                  Sacrifice, Purpose, Discipline, Community]
    examples_note: >-
      These are the Executive's own examples, transcribed. They are ILLUSTRATIVE, not a closed
      vocabulary, and the platform shall not treat them as an enumeration to validate against.
    is_not: [a mood, a summary, "a soundtrack instruction", an emotion]

  editorial_transition:
    title: "Contextual Shift"
    definition: >-
      The fundamental change in audience understanding that occurs between the current
      narrative segment and the next.
    answers: "What changes in the viewer's journey?"
    characteristics: [narrative only, documentary only, "independent of music",
                      "independent of editing mechanics", "independent of NLE transitions"]
    examples_given_by_executive:
      - "Anticipation becomes disciplined action."
      - "Individual reflection broadens into collective purpose."
      - "Ceremonial recognition resolves into enduring fellowship."
    excludes: ["cross dissolves", cuts, fades, "cue transitions",
               instrumentation, tempo, harmony]
    open_question_raised_not_resolved:
      id: OQ-2
      subject: "the terminal beat has no successor"
      statement: >-
        The definition is relational - it describes the shift from the current segment TO THE
        NEXT. Six declared beats have five inter-beat boundaries. Whichever beat is last has no
        successor and therefore no transition to describe. Which beat is last depends on the
        EPR-07 disposition (PBC-1), which is itself open. Whether the terminal beat's field is
        left empty, or carries the shift out of the film and into whatever follows it, is an
        EXECUTIVE determination. RAISED, NOT ANSWERED. Nothing was defaulted.
      owner: EXECUTIVE

# ----------------------------------------------------------------------------
# AUTHORING PRINCIPLE
# Declared by the Executive 2026-08-28. Transcribed verbatim.
# ----------------------------------------------------------------------------
authoring_principle:
  statement: "Author the story first. The music follows."
  test: >-
    Every answer in EPR_EXECUTIVE_AUTHORING_WORKBOOK.md should be one that remains true even if
    the documentary were shown in complete silence.
  boundary: >-
    If a statement depends on music to be meaningful, it belongs downstream in the Behavior
    Registry or Conductor Score - not in EPR-001.
  relationship_to_invariant_a: >-
    This principle is the authoring-side expression of Invariant A. Invariant A binds the
    platform not to let documentary intent prescribe musical implementation; this principle
    binds the AUTHOR not to write musical implementation into documentary intent. Same boundary,
    approached from opposite sides.

