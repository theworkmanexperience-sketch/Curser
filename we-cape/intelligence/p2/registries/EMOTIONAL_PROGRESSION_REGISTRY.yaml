    WET-SPEC-RSB-001 exists. Nothing is blocked today because
    GATE-2026-08-22-MIE-DOWNSTREAM is CLOSED, but this becomes live at gate-open.
    See IR-002 section 1.

intensity_scale:
  # RESOLVED 2026-08-28 by Executive Ruling Q11 - "Ordered Categorical Dramatic Intensity
  # Standard". Transcribed verbatim; the platform proposed nothing and chose nothing.
  ordered: true
  scale_class: ORDERED_CATEGORICAL
  measures: "narrative significance within the documentary"
  order: [LOW, MODERATE, HIGH, ELEVATED, CLIMACTIC]   # lowest to highest, as declared
  ordinal_constraints:
    - "The categories are ordinal."
    - "They are not numerical."
    - "They shall never be averaged, interpolated, scored, normalized, or smoothed."
    - "Advancement between categories is by explicit Executive declaration only."
  ruling_ref: "Executive Ruling Q11, 2026-08-28"
  ruling_rationale_verbatim: >-
    This preserves the Non-Interpolation Invariant while allowing the documentary to express a
    coherent dramatic progression.
  resolved_question:
    id: OQ-1
    subject: "comparison versus trend derivation"
    status: RESOLVED
    resolved: '2026-08-28'
    resolved_by: "Executive Producer / Chairman"
    ruling_verbatim: >-
      Comparing discrete steps (e.g., checking if the next beat is higher or lower for a
      handoff) is a legitimate transition check, but algorithmic trend-fitting or
      curve-smoothing remains barred by Invariant B.
    original_question: >-
      Ordinality newly permits a consumer to COMPARE two declared levels. Invariant B prohibits
      inferring "trends" between declared segment levels. The four ordinal_constraints bar
      averaging, interpolation, scoring, normalization and smoothing - they did not say whether
      observing that one declared beat outranks another, and naming that relation, is a
      permitted comparison or a prohibited derived state.
    platform_reading_pending_confirmation: >-
      When a consumer is eventually built against this ruling, the platform will read it as:
      PERMITTED - a pairwise comparison of two ADJACENT declared levels, yielding higher /
      lower / equal, for the purpose of a transition or handoff check.
      BARRED - any operation spanning three or more declared levels to produce a shape, curve,
      slope, arc or direction-of-travel, and any function that emits a value not itself
      declared by the Executive.
      This reading is the platform's, NOT the Executive's words. It is recorded so that the
      first implementation cannot quietly widen the ruling. If it is wrong, correcting it here
      is cheaper than correcting a Behavior Registry built on it.
    first_affected_consumer: "Behavior Registry (does not yet exist)"
    scope_clarification_2026_08_28: >-
      RECORDED SO A LATER AUDIT DOES NOT MISREAD THE RECORD. OQ-1 and Invariant B bind
      DOWNSTREAM CONSUMERS of this registry. They do not bind the EXECUTIVE, who is the author.
      The ordinal_constraints state that "advancement between categories is by explicit
      Executive declaration only" - reasoning about the shape of the progression is therefore
      exactly how a declaration is arrived at, and is the Executive's prerogative. Where an
      Executive authoring declaration describes an arc across declared beats, that is authorship,
      not interpolation. The prohibition is on the PLATFORM deriving a shape nobody declared.
  naming_note: >-
    The field is called dramatic_intensity and the ruling defines the scale as measuring
    narrative SIGNIFICANCE. Those are not the same word. Under this ruling ELEVATED
    ("Commanding, Emotionally Significant") outranks HIGH ("Purposeful, Energetic") - coherent
    for significance, counterintuitive for energy. Recorded so a future reader who sees only the
    field name does not infer an energy scale. The field is NOT renamed: renaming an
    Executive-ratified field is not a platform act.
  categories:
    LOW:       [Reflective, Observational]
    MODERATE:  [Engaged, Conversational]
    HIGH:      [Purposeful, Energetic]
    ELEVATED:  [Commanding, "Emotionally Significant"]
    CLIMACTIC: [Defining, Irreversible]

prohibited_fields: [palette, instrumentation, stems, BPM, harmony, genre, prompts,
                    dynamics, cue_behaviour, timecodes]

# ----------------------------------------------------------------------------
# FIELD DEFINITIONS
# Declared by the Executive 2026-08-28 in answer to the Authoring Workbook section 0.2,
# which recorded that these two fields had been named by the ratification order and never
# given a meaning. TRANSCRIBED VERBATIM. The platform supplied no definition and did not
# paraphrase, condense or extend either one.
# ----------------------------------------------------------------------------
field_definitions:
  governing_theme:
    title: "Narrative Anchor"
    definition: >-
      The enduring human, institutional, or societal truth that justifies the segment's place
      within the documentary.
    answers: "Why does this scene belong in the film?"
    characteristics: [timeless, narrative, documentary,
                      "independent of music", "independent of editing"]
    examples_given_by_executive: [Service, Brotherhood, Leadership, Legacy,
                                  Sacrifice, Purpose, Discipline, Community]
    examples_note: >-
      These are the Executive's own examples, transcribed. They are ILLUSTRATIVE, not a closed
      vocabulary, and the platform shall not treat them as an enumeration to validate against.
    is_not: [a mood, a summary, "a soundtrack instruction", an emotion]

  editorial_transition:
    title: "Contextual Shift"
    definition: >-
      The fundamental change in audience understanding that occurs between the current
      narrative segment and the next.
    answers: "What changes in the viewer's journey?"
    characteristics: [narrative only, documentary only, "independent of music",
                      "independent of editing mechanics", "independent of NLE transitions"]
    examples_given_by_executive:
      - "Anticipation becomes disciplined action."
      - "Individual reflection broadens into collective purpose."
      - "Ceremonial recognition resolves into enduring fellowship."
    excludes: ["cross dissolves", cuts, fades, "cue transitions",
               instrumentation, tempo, harmony]
    resolved_question:
      id: OQ-2
      subject: "the terminal beat has no successor"
      status: RESOLVED
      resolved: '2026-08-28'
      resolved_by: "Executive Producer / Chairman"
      ruling_verbatim: >-
        The final beat in the episodic cut has no successor; its editorial_transition cleanly
        resolves to a concluding resolution statement, so no field is left syntactically
        dangling.
      rule: >-
        The terminal beat's editorial_transition is NOT left empty. It carries a concluding
        resolution statement.
      example_of_form_given_by_executive: "Concludes the episodic narrative in lasting communal resolution."
      example_handling: >-
        THE EXAMPLE ABOVE WAS NOT APPLIED TO ANY ENTRY. It was offered with "e.g." as an
        illustration of the FORM a concluding resolution statement takes, not as the value of
        any beat's field. Writing it into an entry would be the platform authoring Executive
        content. Every editorial_transition remains AWAITING_EXECUTIVE_INPUT.
      dependency_note: >-
        WHICH beat is terminal is still open: it depends on the EPR-07 disposition (PBC-1),
        unanswered in the Authoring Workbook at Q10. The RULE is settled; its SUBJECT is not.
      deferred_consequence:
        id: OQ-2a
        statement: >-
          The ruling says "the final beat in the episodic cut". The ratified deliverable is
          THREE episodes. If editorial_transition is scoped to the film, there is one terminal
          beat; if scoped to each episode, there are three, and a beat spanning an episode
          boundary would end mid-beat. This cannot be settled before segment-to-episode
          assignment exists (PBC-3), which requires the Editorial Timing Contract that has not
          been produced. RAISED, NOT ANSWERED, and not blocking: authoring proceeds at beat
          level, where the question does not arise.
        owner: EXECUTIVE
        blocked_by: PBC-3

# ----------------------------------------------------------------------------
# AUTHORING PRINCIPLE
# Declared by the Executive 2026-08-28. Transcribed verbatim.
# ----------------------------------------------------------------------------
authoring_principle:
  statement: "Author the story first. The music follows."
  test: >-
    Every answer in EPR_EXECUTIVE_AUTHORING_WORKBOOK.md should be one that remains true even if
    the documentary were shown in complete silence.
  boundary: >-
    If a statement depends on music to be meaningful, it belongs downstream in the Behavior
    Registry or Conductor Score - not in EPR-001.
  relationship_to_invariant_a: >-
    This principle is the authoring-side expression of Invariant A. Invariant A binds the
    platform not to let documentary intent prescribe musical implementation; this principle
    binds the AUTHOR not to write musical implementation into documentary intent. Same boundary,
    approached from opposite sides.
  music_bed_segments_directive:
    # Executive ruling, 2026-08-28, in answer to the workbook section 0.3 flag.
    applies_to: [S01, S15, S18]
    applies_to_note: >-
      The three segments whose registry identity is musical - S01 cold_open ("music-bed ASR
      fragments"), S15 riding_music_passage and S18 bike_night_ambience, the latter two carrying
      music_present true with zero interviews.
    ruling_verbatim: >-
      When scoring riding passages or ambient scenes, the narrative intent focuses entirely on
      visual story and dramatic purpose, completely stripped of musical prompts.
    examples_of_focus_given_by_executive: ["the visual discipline of the pack", "the physical journey"]
    example_handling: >-
      Offered with "e.g." as illustrations of WHERE the narrative intent should focus. NOT
      APPLIED to any entry. No governing_theme, editorial_transition or dramatic_intensity was
      authored, drafted or seeded from them.

governing_theme_convention:
  # Executive precedent established with the EPR-02 authoring declaration, 2026-08-28.
  # Transcribed verbatim. Answers the vocabulary question raised after EPR-01.
  established: '2026-08-28'
  established_by: "EXECUTIVE AUTHORING DECLARATION - EPR-02"
  rule_verbatim: >-
    Compound themes are authorized when they express one unified narrative idea rather than a
    list of concepts.
  function_verbatim: >-
    The governing theme shall function as a narrative anchor, not a keyword collection.
  examples_given_by_executive: ["Brotherhood Gathering", "Shared Purpose", "Quiet Leadership",
                                "Service Through Action", "Collective Identity",
                                "Leadership by Example"]
  example_handling: >-
    ILLUSTRATIONS OF THE CONVENTION, NOT DECLARATIONS. Two of the six - "Brotherhood Gathering"
    and "Shared Purpose" - are already declared, at EPR-01 and EPR-02 respectively. The other
    four are NOT assigned to any beat, were NOT applied, and shall NOT be drawn on to populate
    EPR-03 through EPR-07 or either undeclared segment. They are a demonstration of form. The
    list is NOT a closed vocabulary and shall not be used as an enumeration to validate against.

field_separation:
  # Executive interpretation, established with the EPR-02 authoring declaration, 2026-08-28.
  # Transcribed verbatim. These responsibilities shall remain distinct throughout the
  # remainder of Executive authoring.
  established: '2026-08-28'
  established_by: "EXECUTIVE AUTHORING DECLARATION - EPR-02"
  binding_scope: "the remainder of Executive authoring"
  fields:
    dramatic_intensity: "The ordered categorical weight of the narrative beat."
    governing_theme: >-
      The enduring truth that justifies the beat's place within the documentary.
    editorial_transition: "The change in audience understanding between narrative beats."
    executive_notes: >-
      Directorial guidance describing how the beat should be handled while preserving
      documentary intent.
  relationship_to_field_definitions: >-
    This block is the Executive's compact statement of each field's RESPONSIBILITY. The fuller
    definitions under `field_definitions` - Narrative Anchor and Contextual Shift - stand
    unchanged and are not superseded by it. Where the two are read together, field_definitions
    describes what a field IS and field_separation describes what it is FOR.

four_question_mapping:
  # Proposed by the platform in the Authoring Workbook section 0.4 and CONFIRMED by the
  # Executive 2026-08-28. Recorded because it governs how eighteen segments are answered.
  status: CONFIRMED
  confirmed: '2026-08-28'
  mapping:
    - {question: "What is happening?",                              maps_to: "context - orientation only, not a field"}
    - {question: "Why does it matter?",                             maps_to: dramatic_intensity}
    - {question: "What is the governing theme?",                    maps_to: governing_theme}
    - {question: "What fundamentally changes for the audience?",    maps_to: editorial_transition}
    - {question: "anything the four cannot carry",                  maps_to: executive_notes}

# ----------------------------------------------------------------------------
# ENTRIES
#   beat / segment_refs / audience_state  -> TRANSCRIBED from EMOTIONAL_ARC v1.0.0
#   dramatic_intensity / governing_theme / editorial_transition / executive_notes
#                                         -> AWAITING_EXECUTIVE_INPUT (never defaulted)
# ----------------------------------------------------------------------------
entries:
  - id: EPR-01
    beat: Arrival
    segment_refs: [S01, S02]
    # AUTHORED BY THE EXECUTIVE 2026-08-28. Transcribed verbatim, not normalised.
    dramatic_intensity: MODERATE
    audience_state: Curiosity
    governing_theme: "Brotherhood Gathering"
    editorial_transition: >-
      The audience moves from observing the gathering to understanding the people whose shared
      purpose gives the gathering meaning.
    executive_notes: >-
      Preserve an observational point of view that welcomes the audience into the experience
      without rushing toward spectacle. Allow viewers to become oriented to the environment, the
      hosts, and the community before introducing individual voices. The opening should create
      anticipation through authenticity, inviting the audience to stay because they want to know
      the people behind the event.
    authored: '2026-08-28'
    authored_by: "Executive Producer / Chairman"
    entry_status: COMPLETE
    rationale:
      # The Executive supplied a rationale attached to each field. Placing them here, rather
      # than in executive_notes, is a PLATFORM STRUCTURAL CHOICE - it preserves the attachment
      # of each rationale to its own field. The words are the Executive's, verbatim.
      # executive_notes was left AWAITING_EXECUTIVE_INPUT because it was not supplied.
      dramatic_intensity: >-
        The opening should invite the audience into the experience rather than overwhelm them.
        The story has begun, but the emotional stakes have not yet been earned. This is an
        orientation beat - viewers are discovering where they are, who they're with, and why this
        gathering matters. The energy is active and engaging without suggesting that the
        documentary has reached a defining or transformative moment.
      governing_theme: >-
        The opening is not fundamentally about motorcycles. It is not fundamentally about Alpha.
        It is not fundamentally about Kansas City. It is about people intentionally coming
        together. Everything that follows - rides, interviews, service, celebration - only has
        meaning because this community has first gathered. "Brotherhood Gathering" is broad
        enough to encompass the weekend while remaining true to what this opening actually
        accomplishes.
      editorial_transition: >-
        The shift is not from one location to another. It is from place to people. Arrival
        establishes context. The interview sequence establishes connection. That is the
        documentary transformation.
    provenance: "EMOTIONAL_ARC v1.0.0 beat Arrival (audience_emotion: Curiosity)"

  - id: EPR-02
    beat: Interviews
    # beat UNCHANGED. The authoring declaration of 2026-08-28 is headed "EPR-02 · Interview
    # Gauntlet", but its Executive Declaration block carries no `beat:` field. The heading was
    # read as a section title, not as a rename. Renaming an EXECUTIVE-custody value on the
    # strength of a heading would be the platform inferring a declaration. RAISED, NOT ACTED ON.
    segment_refs: [S03]
    # AUTHORED BY THE EXECUTIVE 2026-08-28. Transcribed verbatim.
    dramatic_intensity: MODERATE
    audience_state: Listening
    governing_theme: "Shared Purpose"
    editorial_transition: >
      Personal convictions become collective action as
