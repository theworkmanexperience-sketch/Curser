# ============================================================================
# EMOTIONAL_PROGRESSION_REGISTRY (EPR-001)
# Governed upstream artifact of DOCUMENTARY INTENT.
#
# Ratified: EXECUTIVE RATIFICATION ORDER & INGESTION PROMPT - EPR-001
#           Authority: Executive Producer / Chairman   Date: 2026-08-26
#           Reference: PR-001 Architectural Review & Triad Alignment
#
# CUSTODY (order 2.1-2.3):
#   Every entry is source_class EXECUTIVE.
#   The platform MAY read, cite and validate STRUCTURE.
#   The platform SHALL NOT author, populate, infer, extend, suggest or default
#   ANY value. An empty field remains empty.
#
# WHAT THE PLATFORM DID IN PRODUCING THIS FILE:
#   TRANSCRIBED the Executive-custody values already declared in
#   EMOTIONAL_ARC.yaml v1.0.0, which order 1.1 names as the provenance of
#   EPR-001's initial content. beat, segment_refs and audience_state are
#   carried forward verbatim (audience_emotion -> audience_state is a rename
#   ruled by the order's schema, not a change of value).
#   Fields with NO existing Executive declaration are left
#   AWAITING_EXECUTIVE_INPUT. They were not defaulted, inferred or suggested.
# ============================================================================
registry_id: EMOTIONAL_PROGRESSION_REGISTRY
registry_version: "1.1.0"
registry_schema_version: "1.0"
source_class: EXECUTIVE
supersedes: "EMOTIONAL_ARC.yaml v1.0.0"
segment_authority: "TIMELINE_REGISTRY v1.0.0 (S01-S19)"
missing_data_policy: propagate_unknown

governing_invariants:
  invariant_a: >-
    Documentary intent shall never prescribe musical implementation;
    observational measurement shall never prescribe documentary intent.
  invariant_b_non_interpolation: >-
    Executive declarations are intentionally non-interpolable. The platform shall not
    infer intermediate states, trends, averages, smoothing, interpolation, or derived
    dramatic states between declared segment levels.

precondition_contract:
  clause: >-
    Every cue decision cites its beat; a cue that cannot name its emotion and
    responsibility does not generate.
  carried_forward_verbatim_from: "EMOTIONAL_ARC.yaml v1.0.0"
  operational_interpretation: >-
    A cue cannot generate until both the Executive documentary intent (EPR-001) and the
    downstream musical responsibility (Behavior layer / Conductor Score) are available.
  engineering_note_IR002_I1: >-
    RAISED, NOT RESOLVED. The musical responsibility vocabulary is DEFERRED to
    WET-SPEC-RSB-001 by order 1.3, and the Behavior Registry does not yet exist (order
    4.3). As written the precondition therefore cannot be satisfied by any cue until
    WET-SPEC-RSB-001 exists. Nothing is blocked today because
    GATE-2026-08-22-MIE-DOWNSTREAM is CLOSED, but this becomes live at gate-open.
    See IR-002 section 1.

intensity_scale:
  ordered: AWAITING_EXECUTIVE_INPUT   # see IR-002 section 4 - are these ordinal or labels?
  categories:
    LOW:       [Reflective, Observational]
    MODERATE:  [Engaged, Conversational]
    HIGH:      [Purposeful, Energetic]
    ELEVATED:  [Commanding, "Emotionally Significant"]
    CLIMACTIC: [Defining, Irreversible]

prohibited_fields: [palette, instrumentation, stems, BPM, harmony, genre, prompts,
                    dynamics, cue_behaviour, timecodes]

# ----------------------------------------------------------------------------
# ENTRIES
#   beat / segment_refs / audience_state  -> TRANSCRIBED from EMOTIONAL_ARC v1.0.0
#   dramatic_intensity / governing_theme / editorial_transition / executive_notes
#                                         -> AWAITING_EXECUTIVE_INPUT (never defaulted)
# ----------------------------------------------------------------------------
