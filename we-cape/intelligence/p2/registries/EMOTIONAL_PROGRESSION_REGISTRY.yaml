# ----------------------------------------------------------------------------
# PATH B CONSEQUENCES - REPORTED, NOT PROCESSED FURTHER
# Recorded under the 2026-08-28 Order section 2.4. Each is a condition the ratified
# production identity creates. NONE is repaired here; repair is regeneration, re-keying
# or Executive authoring, all of which that Order withholds.
# ----------------------------------------------------------------------------
path_b_consequences:
  - id: PBC-1
    condition: EPR-07 segment reference unresolvable
    detail: >-
      S19's declared span in the superseded assembly lies wholly beyond the governed
      production's runtime. Figures in EPR-001_VALIDATION_REPORT_PATH_B.md.
    disposition: UNRESOLVED_PENDING_EXECUTIVE
    owner: EXECUTIVE

  - id: PBC-2
    condition: S18 declared boundary extends beyond the governed runtime
    detail: >-
      S18's declared START falls inside the governed production's runtime and its declared END
      falls outside it. S18 is IN SCOPE for Executive authoring per the Order's S01-S18
      directive, and EPR-06 already references it. The segment is not re-derived here.
      Figures in EPR-001_VALIDATION_REPORT_PATH_B.md.
    disposition: BOUNDARY_OUT_OF_RANGE_PENDING_REDERIVATION
    owner: platform, after regeneration is authorized

  - id: PBC-3
    condition: no segment-to-episode assignment exists
    detail: >-
      The Order describes S01-S18 as "active episodic segments" and the three Parts as the
      distribution deliverables. DAY2_PARENT_FORENSIC_AUDIT establishes which contiguous region
      of the Parent each Part body is drawn from. Assigning segments to those episodes requires
      segment positions in the 08-24 Parent, which do not exist: the only positions on record
      are spans in the superseded assembly, related to the governed timeline by five distinct
      piecewise lags. ANY assignment made today would be inference. NONE WAS MADE.
      Figures in EPR-001_VALIDATION_REPORT_PATH_B.md.
    disposition: NOT_DERIVABLE_WITHOUT_REGENERATION
    owner: platform, after regeneration is authorized

  - id: PBC-4
    condition: intensity scale ordinality still undeclared
    detail: >-
      intensity_scale.ordered remains AWAITING_EXECUTIVE_INPUT. The five ratified tokens are
      reaffirmed by the 2026-08-28 Order but their ordinality is not. Until declared, no
      consumer may sort, compare or reason about relative intensity. Put to the Executive in
      the Authoring Workbook.
    disposition: AWAITING_EXECUTIVE_DECLARATION
    disposition_token_note: >-
      Deliberately NOT the string AWAITING_EXECUTIVE_INPUT. That token is the census marker for
      unfilled Executive FIELDS, and V-6 counts it; using it on a consequence record would
      inflate that census by one without an actual field being empty.
    owner: EXECUTIVE

  - id: PBC-5
    condition: precondition contract still unsatisfiable (IR-002 I1, carried forward)
    detail: >-
      Unchanged by this ratification. The musical-responsibility half of the precondition is
      deferred to WET-SPEC-RSB-001, which does not exist. Not blocking while regeneration is
      suspended; live at gate-open.
    disposition: RAISED_NOT_RESOLVED
    owner: EXECUTIVE
