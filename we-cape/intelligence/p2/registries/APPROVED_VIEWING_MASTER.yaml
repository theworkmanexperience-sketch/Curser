      - path: "Alpha RoundUp Part 2 /Reduced_Part_2.mp4"
        exact_runtime_s: 4850.810000
        delta_vs_lock_s: 4.185
        resolution: 320x180
        size_bytes: 389000000
        editorial_conformance: NON_CONFORMANT
        approval_status: REFERENCE_ONLY
        hazard: LOW

      - path: "Saftey File/Alpha RoudUp Part 2 Safe 2.m4v"
        exact_runtime_s: 4861.833333
        delta_vs_lock_s: 15.208
        resolution: 3840x2160
        size_bytes: 12000000000
        editorial_conformance: NON_CONFORMANT
        approval_status: REFERENCE_ONLY
