# ============================================================================
# Approved Viewing Master Register
# Executive Ruling, 2026-08-22: "Before any Executive Viewing Session (EVS),
# the platform shall designate exactly ONE Approved Viewing Master. Every other
# render becomes reference only."
#
# Doctrine: DOC-001 Amendment 1 — validate the instrument by conformance before
# trusting its fidelity.
#
# EXACTLY ONE entry per production may carry status: APPROVED.
# A render absent from this register is NOT approved. Silence is not approval.
# ============================================================================
register_id: APPROVED_VIEWING_MASTER
register_version: 1.0.0
schema_version: 1.0
conforms_to: DOC-001 Amendment 1
authority: Executive Producer
date: '2026-08-22'

minimum_evidence:
  note: >-
    Executive Ruling 2026-08-22. Every field below is REQUIRED before a render may
    be designated APPROVED. A missing field is a disqualification, not a caveat.
  required_fields:
    - sha256
    - exact_runtime_s
    - frame_rate
    - resolution
    - editorial_conformance
    - approval_status
  conformance_definition: >-
    editorial_conformance compares exact_runtime_s against the governed editorial lock
    duration. CONFORMANT means equality to the millisecond. Anything else is
    NON_CONFORMANT and is ineligible for any judgement expressed in timecode - it is not
    a lower-quality option, it is a different film.
  selection_rule: >-
    Conformance FIRST, fidelity SECOND. Among conformant candidates prefer the highest
    fidelity. Never select by resolution, file size or filename.

productions:
  - production: Alpha RoundUp Part 2
    editorial_lock_duration_s: 4846.625
    lock_format: 3840x2160p24 NDF
    lock_sources:
      fcpxml_sha256: 2bf0685373d6963bc151b982fd8b16b072d47ca88bb36f3c4dcd4cf5563858e7
      etc_sha256: e91318a6719c81e448e6c57267dff7a807076cb9aded822a459fb6353e80010d

    approved_viewing_master:
      path: "AlphaRoundUp_2026/Alpha RoundUp Part 2 /XML retry/Thursday Aug 20th/Alpha RoudUp Part 2.m4v"
      volume: WE_CAPE_OUTPUT
      sha256: 89e911b1bffe14cefe330f8e4270d467dc06393b622143350ca42de8dbf8cd46
      exact_runtime_s: 4846.625000
      frame_rate: 24/1
      frame_rate_note: NDF, non-drop
      resolution: 3840x2160
      video_codec: h264
      audio: AAC 48 kHz stereo
      size_bytes: 12199752138
      editorial_conformance: CONFORMANT      # exact to the millisecond, delta 0.000 s
      approval_status: APPROVED
      approved_by: Executive Producer
      approved_date: '2026-08-22'
      approved_for: Executive creative and editorial judgement, Alpha RoundUp Part 2
      validated_by: Implementation Engineer
      validation_method: >-
        ffprobe duration, frame rate and stream inventory read directly from the container;
        SHA-256 computed over the whole file; duration compared against the governed lock.
        Stated as a number, not an adjective (DOC-001 rule 2).
      first_session: EVS-001

    # ------------------------------------------------------------------
    # REFERENCE ONLY. None of these may be used for a timecoded judgement.
    # The three NON_CONFORMANT 4K/large renders are the live hazard: same size,
    # same codec, same resolution, nearly the same filename as the approved file.
    # ------------------------------------------------------------------
    reference_only:
      - path: "Alpha RoundUp Part 2 /XML retry/Thursday Aug 20th/Reduced Files/Alpha RoudUp Part 2.mp4"
        exact_runtime_s: 4846.625000
        resolution: 720x480
        size_bytes: 1600000000            # 1.6 GB, du -h
        editorial_conformance: CONFORMANT
        approval_status: REFERENCE_ONLY
        reason: conformant but lower fidelity; the 4K master supersedes it for creative judgement

      - path: "Alpha RoundUp Part 2 /XML retry/Thursday Aug 20th/Final Data Source Files/Filmage_Editor.mp4"
        exact_runtime_s: 4846.747000
        delta_vs_lock_s: 0.122
        resolution: 320x180
        sha256: a53655fc673945a0d99dde3d5b60c9a126d8b41e4e44a7c7eedeb058ba0f47e8
        size_bytes: 399320021
        editorial_conformance: NEAR_CONFORMANT
        approval_status: REFERENCE_ONLY
        approved_use: >-
          ENGINEERING ONLY - timing, synchronisation, level analysis, registry extraction.
          This is the Sprint 3A / RE-001 proxy. Its methodology is now empirically corroborated:
          its region level deltas agree with the approved master to within 0.031 dB (see
          instrument_agreement below). It remains valid for the tasks it was validated for.
          It is NOT approved for Executive creative judgement.
        watermarked: true

      - path: "Saftey File/Alpha RoudUp Part 2_SRT_.m4v"
        exact_runtime_s: 4848.125000
        delta_vs_lock_s: 1.500
        resolution: 854x480
        size_bytes: 941000000
        editorial_conformance: NON_CONFORMANT
        approval_status: REFERENCE_ONLY
