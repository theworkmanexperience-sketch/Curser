    selection_hazard_summary:
      total_candidates: 7
      conformant: 2
      non_conformant: 5
      four_k_candidates: 3
      four_k_conformant: 1
      finding: >-
        Selecting a viewing master by fidelity alone would have been wrong two times in three.
        A 720x480 render is conformant while two 3840x2160 renders are not. Fidelity and
        conformance are independent properties and only one of them makes a timecode mean
        anything. This register exists so the question is never asked twice.

    instrument_agreement:
      note: >-
        DOC-001 rule 4 - where a second independent check is available at low cost, take it.
        Region level deltas recomputed from the approved master's 48 kHz audio and compared
        with the Sprint 3A proxy series they were originally derived from.
      checks:
        - measurement: across CUE-03 out (00:29:10)
          master_db: 0.5565
          proxy_db: 0.5251
          agreement_db: 0.031
        - measurement: across SIL-01 in (00:31:43)
          master_db: -7.6244
          proxy_db: -7.6476
          agreement_db: 0.023
      conclusion: >-
        A 320x180 / 44.1 kHz proxy and a 3840x2160 / 48 kHz master agree to within 0.03 dB on
        both deltas that carry the EVS-001 finding. The Sprint 3A proxy methodology now has
        empirical validation for timing and level analysis. Verdicts unchanged: no audible
        event at 29:10; a large audible event at 31:43.

