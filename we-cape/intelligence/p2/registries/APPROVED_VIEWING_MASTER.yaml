      - path: "Saftey File/Alpha RoudUp Part 2 - Saftey .m4v"
        exact_runtime_s: 4868.625000
        delta_vs_lock_s: 22.000
        resolution: 3840x2160
        size_bytes: 12000000000
        editorial_conformance: NON_CONFORMANT
        approval_status: REFERENCE_ONLY
        hazard: HIGH
        hazard_note: >-
          12 GB, 3840x2160, h264. The largest deviation of any candidate, and the delta is a
          suspiciously round 22.000 s - consistent with a slate, countdown or alternative tail,
