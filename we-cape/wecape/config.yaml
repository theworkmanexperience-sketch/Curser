grouping:
  camera_offsets:
    DJI: 0
    GoPro: 0
    Insta360: 0
    Unknown_Camera: 0
    iPhone: 0
  min_cameras: 2
  window_seconds: 15               # Field-validated: DJI/Insta360 clock drift
                                   # is 6-12s in production (Community Service MG-02+)
                                   # RFQ §7 specifies ±5s as default — widened to ±15s
                                   # after empirical testing showed ±5s produces 67%
                                   # ungrouped files on real DJI+Insta360 datasets.
                                   # Deviation documented: June 22, 2026
logging:
  log_format: json
  log_level: INFO
  retain_logs_days: 90
output:
  date_format: '%Y-%m-%d'
  group_id_prefix: MCG
performance:
  hash_chunk_size_mb: 64
  max_workers: 8
pipeline:
  enable_duplicate_content_detection: false
  file_operation: symlink
  run_id_prefix: WEF
  # Orchestration engine: 'stages' routes the run through core.stage.run_stages()
  # (the PipelineStage seam — default). 'legacy' calls the identical stage methods
  # directly (rollback path). Output is equivalent; 'stages' adds per-stage audit.
  engine: stages
intelligence:
  # P6: AI is additive and never foundational. Disabled in v1. When true, a no-op
  # placeholder stage is appended to demonstrate where J1-J5 AI stages plug in.
  enabled: false
registry:
  # Strict audit mode (P3 / compliance-first): when true (default), a run aborts
  # if it cannot write its audit trail to the local registry, rather than
  # completing silently without a record. Set false to downgrade audit-write
  # failures to warnings. Always relaxed automatically under WECAPE_TEST_MODE.
  strict: true
lineage:
  # Derivation lineage (schema v3): record that a curated 'select' derives from a
  # source clip — SEPARATE from §8 variant detection (derivation, not duplicate).
  # A select is named <source_stem>_sel<NN> (e.g. VID_..._006_sel01), captured in
  # content.source_clip / source_clip_sha for querying + W.E. ARCHIVE (J5).
  # Additive metadata; safe no-op for filenames that don't match select_pattern.
  enabled: true
  select_pattern: '_sel\d+'
proxies:
  generate_proxies: false
variant_detection:
  duplicate_keywords:
  - copy
  - final
  - backup
  - duplicate
  indexed_pattern: '[\(\[](\d+)[\)\]]'
  parent_selection: largest_file
  suffix_patterns:
  - _v\d+
  - _edit
  - _final
  - _export
  - _rev\d*

proxy_generation:
  enabled: false          # activate via --proxy flag or profile
  target_files: camera_only  # camera_only | camera_and_generic | all_video
  resolution: 720p
  bitrate_mbps: 1.5
  encoder: h264_videotoolbox  # h264_videotoolbox (macOS) | libx264 (cross-platform)
  preset: fast            # libx264 only; ignored by videotoolbox
  output_folder: PROXIES
  skip_unchanged: true    # SHA-256 based — only retranscode if source changed
  workers: 4              # NVMe TB4 direct — installed June 8, 2026 (3,098 MB/s confirmed)
                          #   4 = NVMe via TB4 (set after Samsung 990 PRO installed)
  preflight: true         # Phase 2: ffprobe duration scan before transcoding starts
  embed_source_timecode: true  # re-stamp each proxy with the source's start timecode
                          #   (ffmpeg -timecode) so FCP accepts it as a proxy for the
                          #   original — without it FCP rejects: "no shared media range"
