archive_engine:
  enabled: true
  encrypted_archives:
    action: quarantine
  extraction:
    isolated_directories: true
    max_nesting_depth: 3
    overwrite_existing: false
    preserve_originals: true
  partial_downloads:
    action: quarantine
    markers:
    - .crdownload
    - .part
    - .download
    - .tmp
    - .partial
  performance:
    hash_chunk_size_mb: 64
    max_workers: 8
  phase: Phase1
  quarantine:
    quarantine_dir: QUARANTINE
  recursive_container:
    flag_as_corrupted: true
    halt_on_detection: true
  repair:
    attempt_repair: true
    repair_timeout_seconds: 30
  size_limits:
    max_single_file_extracted_gb: 10
    max_total_extracted_gb: 50
  supported_formats:
  - .zip
  - .gz
  - .tar
  - .tar.gz
  - .tgz
  enabled_comment: Now ON by default (Phase 1+). Was gated for v4.1 retail.
audio_classification:
  default_classification: generic
  field_recorder_patterns:
  - ^ZOOM\d*
  - ^ZH\d
  - ^SD_\d+
  - ^F\d+_\d+
  - ^TASCAM_
  - ^DR\d+_
classification:
  # Per-camera folder -> physical body (distinct multicam source, §7).
  # 'pattern' matches a parent folder name; 'camera_model' is the source label.
  camera_folder_patterns:
  - camera_model: DJI Osmo Action 5
    pattern: DJI ACTION 5
  - camera_model: DJI Osmo Action 6
    pattern: DJI ACTION 6
  - camera_model: Insta360 X5
    pattern: Insta360 X5
  - camera_model: iPhone
    pattern: iPhone
  - camera_model: OM System OM-1
    pattern: OM SYSTEM
  camera_sources:
    Blackmagic:
      extensions:
      - .braw
      - .mp4
      - .mov
      - .dng
      patterns:
      - ^Blackmagic_
      - ^BMPCC
    Canon:
      extensions:
      - .mov
      - .mp4
      - .cr3
      - .cr2
      patterns:
      - ^MVI_\d+
      - ^_MG_\d+
    DJI:
      extensions:
      - .mp4
      - .mov
      - .jpg
      - .jpeg
      - .dng
      patterns:
      - ^DJI_
      - ^DJI\d
      - DJI_\d{4}
    Generic_Camera:
      extensions:
      - .mp4
      - .mov
      - .mxf
      - .avi
      - .mkv
      patterns:
      - ^\d{8}_\d{6}
      - ^\d{4}-\d{2}-\d{2}
    GoPro:
      extensions:
      - .mp4
      - .thm
      - .jpg
      patterns:
      - ^GOPR\d+
      - ^GP\d{6}
      - ^GH\d{6}
      - ^GX\d{6}
      - ^GL\d{6}
    iPhone:
      extensions:        # VIDEO only — iPhone photos (.heic/.jpg) fall through to stills
      - .mov
      - .mp4
      - .m4v
      patterns:
      - ^IMG_\d+
    Insta360:
      extensions:
      - .insv
      - .insp
      - .mp4
      - .jpg
      patterns:
      - ^ISD_
      - ^VID_
      - _00_\d+\.insv
      - ^PRO_VID
    OMSystem:
      extensions:
      - .mov
      - .mp4
      - .orf
      - .jpg
      - .jpeg
      patterns:
      - ^P\d{7}
      - ^PA\d{6}
    Sony:
      extensions:
      - .mxf
      - .mp4
      - .mov
      patterns:
      - ^C\d{3}S\d{4}
      - ^CLIP\d+
      - ^M2U\d+
    iPhone:
      extensions:
      - .mov
      - .mp4
      - .heic
      - .jpg
      - .jpeg
      patterns:
      - ^IMG_\d{4}
      - ^MOV_\d{4}
      - ^RPReplay
      - ^AAL
  generic_filename_prefixes:
  - Screen Recording
  - Screencast
  - Screenshot
  - T_Workman_
  - grok-video-
  - ChatGPT Image
  generic_filename_substrings:
  - _screenshot
  generic_folder_patterns:
  - Media File vid and pics
  - Media Files
  - 2. Road Glide
  generic_image_extensions:
  - .png
  - .tiff
  - .tif
  - .bmp
  - .gif
  - .psd
  - .ai
  - .eps
  generic_video_extensions:
  - .mp4
  - .mov
  - .avi
  - .mkv
  - .wmv
  - .flv
  - .webm
  reference_extensions:
  - .lrv
  - .pdf
  - .docx
  - .xlsx
  - .pptx
  - .txt
  - .xml
  - .csv
  - .srt
  - .vtt
  - .aaf
  - .edl
  - .fcpxml
  reference_folder_patterns:
  - MEDIA KIT FILES
  - PRESS KIT
  - MEDIA KIT
