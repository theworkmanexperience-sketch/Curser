# W.E. FLOW — Default Profile Reference
# All keys shown here can be overridden in any client profile.
# A client profile only needs to include the keys it changes.
# Missing keys fall back to config.yaml defaults.

profile_name: default
profile_version: "1.0"
client: ""
description: "Annotated reference — all overridable keys"
created: "2026-05-27"

# ── Pipeline ─────────────────────────────────────────────────────────────────
pipeline:
  file_operation: symlink           # symlink | copy | move
  enable_duplicate_content_detection: false

# ── Performance ──────────────────────────────────────────────────────────────
performance:
  max_workers: 8
  hash_chunk_size_mb: 64

# ── Grouping ─────────────────────────────────────────────────────────────────
grouping:
  window_seconds: 15
  min_cameras: 2
  camera_offsets:                   # Per-camera UTC clock correction (seconds)
    DJI: 0
    Insta360: 0
    iPhone: 0
    GoPro: 0

# ── Classification ───────────────────────────────────────────────────────────
classification:
  camera_folder_patterns: []        # Per-client folder → camera_model mapping
  generic_filename_prefixes:        # Prefixes routed to GENERIC/
    - Screen Recording
    - Screencast
    - Screenshot
    - _screenshot

# ── Audio ────────────────────────────────────────────────────────────────────
audio_classification:
  field_recorder_patterns:          # Regex patterns for Camera-Audio classification
    - "^ZOOM\\d*"
    - "^SD_\\d+"
    - "^DR\\d+_"
    - "^TASCAM_"
  default_classification: generic

# ── Variant detection ────────────────────────────────────────────────────────
variant_detection:
  parent_selection: largest_file    # largest_file | lowest_index | earliest_timestamp

# ── Output ───────────────────────────────────────────────────────────────────
output:
  date_format: "%Y-%m-%d"
  group_id_prefix: MCG

# ── Archive engine ───────────────────────────────────────────────────────────
archive_engine:
  enabled: false                    # Phase 1 — disabled by default

proxy_generation:
  enabled: true
  target_files: camera_only
  resolution: 720p
  bitrate_mbps: 1.5
  encoder: h264_videotoolbox
  preset: fast
  output_folder: PROXIES
  skip_unchanged: true
