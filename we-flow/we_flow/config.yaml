# ─────────────────────────────────────────────────────────────
# Stage 0.5 — Archive Intelligence & Recovery Engine (Phase 1)
# Locked: Disabled for Phase 0 retail gate
# ─────────────────────────────────────────────────────────────
archive_engine:
  enabled: true                       # Phase 1 only — do not change for retail
  phase: "Phase1"

  supported_formats: [".zip", ".gz", ".tar", ".tar.gz", ".tgz"]

  extraction:
    preserve_originals: true
    max_nesting_depth: 3
    isolated_directories: true
    overwrite_existing: false

  size_limits:
    max_single_file_extracted_gb: 10
    max_total_extracted_gb: 50

  partial_downloads:
    markers: [".crdownload", ".part", ".download", ".tmp", ".partial"]
    action: "quarantine"

  encrypted_archives:
    action: "quarantine"

  recursive_container:
    halt_on_detection: true
    flag_as_corrupted: true

  repair:
    attempt_repair: true
    repair_timeout_seconds: 30

  quarantine:
    quarantine_dir: "QUARANTINE"

  performance:
    max_workers: 8
    hash_chunk_size_mb: 64
